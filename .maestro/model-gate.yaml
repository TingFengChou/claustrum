# Maestro UI / journey 測試 —— onboarding、模型同意 gate 與手動啟動守護。
# 執行(需連接裝置/模擬器 + 已安裝 app):
#   maestro test .maestro/model-gate.yaml
# UI/端到端自動化一律用 Maestro(見 docs/DEVELOPMENT.md 測試紀律)。
appId: com.claustrum
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
- extendedWaitUntil:
    visible: "略過"
    timeout: 10000
- tapOn: "略過"
- assertVisible: "CLAUSTRUM"
- tapOn: "模型"
- assertVisible: "Edge AI 模型"
- assertVisible: "Gemma-3n-E2B-it-int4"
- assertVisible: "EfficientDet-Lite2 int8"
- assertVisible:
    text: ".*Hugging Face.*"
# 開啟權杖設定對話框並確認說明可見(不驗證任何真實權杖值)
- tapOn: "設定"
- assertVisible: "Hugging Face 存取權杖"
- tapOn: "取消"
# MediaPipe 必須先揭露 metrics；旅程拒絕，不做真實網路下載。
- tapOn:
    text: "下載並啟用"
- assertVisible: "啟用 MediaPipe 物件候選"
- assertVisible:
    text: ".*API 使用量.*延遲.*錯誤.*"
- tapOn: "不要啟用"
# 手動啟動相機；守護頁進入時不應自動取幀。
- tapOn: "守護"
- assertVisible: "▶  啟動守護"
- tapOn: "▶  啟動守護"
- assertVisible: "守護中"
- assertVisible:
    text: "L0 .*Δ.*"
