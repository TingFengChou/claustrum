# Copy to backends.yaml and edit.
#
# Phone-first (ADR-0004): the model is served ON the Pixel 10 and reached from
# the host over `adb forward`. The benchmark client only ever talks to
# 127.0.0.1:<port> on the host -- adb tunnels it to the phone.
#
#   adb forward tcp:8082 tcp:8082     # host:8082 -> phone:8082
#
# Whatever serves the model just needs an OpenAI-compatible
# /v1/chat/completions endpoint. Standing that up on Android is not one command
# -- see docs/M0-phone-setup.md (llama.cpp/Termux for fast M0 numbers, a
# LiteRT-LM harness app for production-fidelity latency).

backends:
  # Gemma E2B and E4B via litert-lm, served on the phone.
  # M0's central question is whether E2B is good enough or E4B is needed for
  # acceptable caption quality -- benchmark both.
  - name: gemma-e2b
    base_url: http://127.0.0.1:8081
    model: gemma-e2b-it
    notes: "smaller/faster; the hope is this clears the hallucination gate"

  - name: gemma-e4b
    base_url: http://127.0.0.1:8082
    model: gemma-e4b-it
    notes: "larger; fallback if E2B captions are not trustworthy"

  # Optional: a MediaPipe LLM Inference path behind a thin OpenAI-compatible
  # shim, if a second on-device data point is wanted. Needs the shim app running.
  # - name: mediapipe-e4b
  #   base_url: http://127.0.0.1:8083
  #   model: gemma-e4b-it

  # Deferred to the Jetson era (ADR-0003/0004). Kept for when hardware arrives.
  # - name: trtllm
  #   base_url: http://127.0.0.1:8090
  #   model: gemma-4-12b
  #   notes: "usually fastest on Jetson, longest to set up (engine build)"
