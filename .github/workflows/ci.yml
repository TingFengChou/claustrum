name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install jsonschema pyyaml requests ruff

      - name: Lint
        run: ruff check core bench || true

      - name: Compile
        run: python -m py_compile core/domain.py bench/run_bench.py bench/tegra_monitor.py bench/phone_monitor.py

      - name: Schema and domain type agreement
        run: python -m unittest discover -s tests -v

      - name: Rust core (host cargo test)
        run: cargo test --manifest-path core-rs/Cargo.toml

      - name: No committed imagery
        run: |
          # The rule protects against committing camera frames (see docs/PRIVACY.md).
          # Legitimate app resources (app/) and design assets (assets/) are allowed;
          # captured frames would land in bench/ or eval/, which stay covered.
          if git ls-files | grep -Ei '\.(jpg|jpeg|png|mp4|mkv)$' | grep -Ev 'README|^app/|^assets/'; then
            echo "::error::image or video files must not be committed (see docs/PRIVACY.md)"
            exit 1
          fi
          echo "clean"

      - name: No person-identity fields in schema
        run: |
          # No PERSON identity fields anywhere (ADR-0002). Bare "name" is allowed
          # (e.g. a drug name in medication.schema.json is not a person identity);
          # the Kineme schema's stricter no-"name" rule is enforced by
          # tests/test_domain.py::test_schema_has_no_identity_field.
          if grep -Eiq '"(face|identity|person_name|age|gender)"' schemas/*.json; then
            echo "::error::schema must not contain person-identity fields (ADR-0002)"
            exit 1
          fi
          echo "clean"

  android-unit-tests:
    # Host JVM unit tests for the Android app (ChangeGate, ModelSpec, …).
    # No device needed; instrumented/journey tests run via Maestro (see docs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon
